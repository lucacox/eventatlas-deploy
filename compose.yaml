services:
  nats:
    image: nats:2.14.4-alpine
    command: ["-js", "-m", "8222", "-sd", "/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - eventatlas-nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: eventatlas
      POSTGRES_PASSWORD: eventatlas
      POSTGRES_DB: eventatlas
    ports:
      - "5432:5432"
    volumes:
      - eventatlas-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username eventatlas --dbname eventatlas"]
      interval: 2s
      timeout: 2s
      retries: 15

  backend:
    init: true
    build:
      context: ${EVENTATLAS_BACKEND_CONTEXT:-../eventatlas}
      dockerfile: Dockerfile.dev
    environment:
      EVENTATLAS_HTTP_ADDRESS: ":8080"
      EVENTATLAS_NATS_URL: "nats://nats:4222"
      EVENTATLAS_DATABASE_URL: "postgres://eventatlas:eventatlas@postgres:5432/eventatlas?sslmode=disable"
      EVENTATLAS_ENVIRONMENT: "development"
      EVENTATLAS_REFRESH_INTERVAL: "5s"
    ports:
      - "8080:8080"
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ${EVENTATLAS_BACKEND_CONTEXT:-../eventatlas}:/workspace
      - eventatlas-go-mod-cache:/go/pkg/mod
      - eventatlas-go-build-cache:/root/.cache/go-build
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/api/v1/topology"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s

  web:
    init: true
    build:
      context: ${EVENTATLAS_WEB_CONTEXT:-../eventatlas-web}
      dockerfile: Dockerfile.dev
    environment:
      EVENTATLAS_API_PROXY_TARGET: "http://backend:8080"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ${EVENTATLAS_WEB_CONTEXT:-../eventatlas-web}:/app
      - eventatlas-web-node-modules:/app/node_modules
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5173/"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s

volumes:
  eventatlas-nats-data:
  eventatlas-postgres-data:
  eventatlas-go-mod-cache:
  eventatlas-go-build-cache:
  eventatlas-web-node-modules:
