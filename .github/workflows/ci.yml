name: Deploy Assets CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Compose and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate shell syntax
        run: sh -n scripts/*.sh

      - name: Validate Compose configuration
        run: docker compose config --quiet

  smoke-test:
    name: Start infrastructure and seed NATS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Start local infrastructure
        run: docker compose up --detach --wait --wait-timeout 120 nats postgres

      - name: Seed and inspect NATS topology
        run: ./scripts/seed-nats-topology.sh

      - name: Print service logs after a failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop local infrastructure
        if: always()
        run: docker compose down --volumes
